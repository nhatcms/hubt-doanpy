{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="card-body">
            <div class="auth-logo">
                <div class="auth-logo-icon">F</div>
                <span class="auth-logo-text">FinanceApp</span>
            </div>

            <h2 class="auth-title">Welcome back</h2>
            <p class="auth-subtitle">Sign in to your account to continue</p>

            <div class="demo-account-info">
                <div class="demo-account-label">
                    <i class="bi bi-info-circle"></i>
                    Demo Account
                </div>
                <div class="demo-account-details">
                    <span class="demo-username">lt22025059</span>
                    <span class="demo-password-divider">/</span>
                    <span class="demo-password">lt22025059</span>
                </div>
                <button type="button" class="btn btn-secondary btn-sm demo-fill-btn" onclick="fillDemoAccount()">
                    <i class="bi bi-arrow-down-circle"></i>
                    Auto Fill
                </button>
            </div>

            <form action="" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-input" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
