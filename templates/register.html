{% extends "base.html" %}

{% block content %}
<div class="auth-page">
    <div class="auth-card card">
        <div class="card-body">
            <div class="auth-logo">
                <div class="auth-logo-icon">F</div>
                <span class="auth-logo-text">FinanceApp</span>
            </div>

            <h2 class="auth-title">Create an account</h2>
            <p class="auth-subtitle">Enter your details to get started</p>

            <form action="" method="POST">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-input" id="username" name="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-input" id="password" name="password" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">Create account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
